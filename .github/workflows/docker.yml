name: Check, build and deploy

# Same pattern as the lobby repos:
# main -> checks, ghcr.io/<repo>:latest, then deployed to the VPS (deploy-jeopardy pulls BOTH Jeopardy images)
# dev  -> checks, ghcr.io/<repo>:dev (not deployed)
# PRs into main only check and build (no push); v* tags publish semver tags without deploying.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables), baked into the image at build time:
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY  pk_live_... of the Clerk production instance (public by design)
#   BACKEND_URL                        optional, default http://jeopardy-backend:8080 (the backend's compose service)
# The secret key (sk_live_...) is NOT here: it only lives in the VPS .env.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # PageProps/LayoutProps are generated by Next (normally during a build); a fresh checkout doesn't have them yet.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha
            type=semver,pattern={{version}}
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            BACKEND_URL=${{ vars.BACKEND_URL || 'http://jeopardy-backend:8080' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pulls the new image on the VPS and restarts Jeopardy. The SSH key can only run
  # /usr/local/bin/deploy-jeopardy (see the vps-infrastructure repo), nothing else.
  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-jeopardy
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          # Copied on Windows, the key has CRLF line endings (or loses its last newline): OpenSSH rejects both.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null \
            || { echo "::error::VPS_SSH_KEY is not a valid private key. Paste the whole jeopardy_deploy_key file (not the .pub)."; exit 1; }

      - name: Pull and restart on the VPS
        run: |
          ssh -p ${{ secrets.VPS_PORT || 22 }} "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo -n /usr/local/bin/deploy-jeopardy"
